<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0088cc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Perfil - Amanda Almeida</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <!-- Background decorativo -->
    <div class="bg-decorative-1"></div>
    <div class="bg-decorative-2"></div>
    <div class="bg-decorative-3"></div>

    <!-- Conteúdo principal integrado diretamente no body -->
    <div class="main-container">
        <!-- Foto de perfil -->
        <div class="profile-picture-container">
            <img
                src="perfil.png"
                alt="Amanda Almeida"
                class="profile-image"
            >
            <div class="verification-badge">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <!-- Informações do perfil -->
        <div class="profile-info">
            <h1 class="profile-name">Amanda Almeida</h1>

            <p class="profile-description">
                Para ser redirecionado para o ambiente exclusivo, basta clicar no botão abaixo:
            </p>
        </div>

        <!-- Botões de redes sociais -->
        <div class="social-buttons">
            <!-- Telegram -->
            <a
                id="redirect-button"
                href="https://t.me/amandinhaalmeida_bot?start=start"
                rel="noopener noreferrer"
                class="social-btn telegram-btn"
            >
                <i class="fab fa-telegram"></i>
                <span>Conteúdo Exclusivo</span>
                <span class="gift-emoji">❤️‍🔥</span>
            </a>
        </div>
    </div>

    <!-- Rodapé com aviso legal -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">
                Todos os direitos reservados a Amanda Almeida,<br class="footer-break">
                qualquer vazamento de imagens<br class="footer-break">
                pessoais é considerado crime sob<br class="footer-break">
                Código Penal (Decreto-Lei 2.848, de 1940).
            </p>
        </div>
    </footer>

    <style>
        /* Reset e configurações básicas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                linear-gradient(
                    145deg,
                    #70ccf5 0%,
                    #229ed9 48%,
                    #0077b5 100%
                );
            background-attachment: fixed;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem 0.75rem 6rem;
            isolation: isolate;
        }

        /* Background decorativo */
        .bg-decorative-1,
        .bg-decorative-2,
        .bg-decorative-3 {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-decorative-1 {
            top: 0;
            left: 0;
            width: 13rem;
            height: 13rem;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.42) 0%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 72%
            );
            transform: translate(-3rem, -3rem);
        }

        .bg-decorative-2 {
            right: 0;
            bottom: 0;
            width: 15rem;
            height: 15rem;
            background: radial-gradient(
                circle,
                rgba(0, 69, 110, 0.28) 0%,
                transparent 70%
            );
            transform: translate(4rem, 4rem);
        }

        .bg-decorative-3 {
            top: 42%;
            right: 8%;
            width: 9rem;
            height: 9rem;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.16) 0%,
                transparent 72%
            );
            filter: blur(2px);
        }

        /* Container principal */
        .main-container {
            position: relative;
            width: 100%;
            max-width: 20rem;
            margin-top: 0.5rem;
            padding: 1.25rem 1rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 1.75rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow:
                0 18px 45px rgba(0, 65, 100, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        /* Foto de perfil */
        .profile-picture-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .profile-image {
            width: 7rem;
            height: 7rem;
            border: 3px solid rgba(255, 255, 255, 0.94);
            border-radius: 50%;
            object-fit: cover;
            box-shadow:
                0 12px 32px rgba(0, 67, 102, 0.28),
                0 0 0 5px rgba(255, 255, 255, 0.08);
        }

        .verification-badge {
            position: absolute;
            top: 0.125rem;
            right: 0.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid white;
            border-radius: 50%;
            background: #0088cc;
            box-shadow: 0 4px 12px rgba(0, 67, 102, 0.25);
        }

        .verification-badge i {
            color: white;
            font-size: 0.75rem;
        }

        /* Informações do perfil */
        .profile-info {
            margin-bottom: 1.5rem;
        }

        .profile-name {
            margin-bottom: 0.25rem;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 5px rgba(0, 56, 88, 0.3);
        }

        .profile-description {
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.94);
            font-size: 1rem;
            line-height: 1.45;
            text-shadow: 0 1px 3px rgba(0, 56, 88, 0.24);
        }

        /* Botões de redes sociais */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        .social-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            width: 100%;
            min-height: 50px;
            padding: 0.85rem 1rem;
            overflow: hidden;
            border: none;
            border-radius: 1.15rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-decoration: none;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                filter 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .social-btn i {
            font-size: 1.15rem;
        }

        .social-btn::before {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
            content: "";
            transition: left 0.55s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 65, 100, 0.28);
            filter: brightness(1.04);
        }

        .social-btn:active {
            transform: translateY(0) scale(0.99);
        }

        /* Botão Telegram */
        .telegram-btn {
            color: white;
            background: linear-gradient(135deg, #FF8A3D 0%, #FF4D00 100%);
            box-shadow:
                0 10px 26px rgba(255, 77, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            animation: slideUp 0.8s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        .telegram-btn i {
            color: white;
        }

        .gift-emoji {
            font-size: 0.95rem;
        }

        /* Rodapé */
        .footer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 0.625rem 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            background: linear-gradient(
                135deg,
                rgba(0, 136, 204, 0.94),
                rgba(0, 91, 145, 0.94)
            );
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 -8px 30px rgba(0, 58, 90, 0.12);
        }

        .footer-content {
            max-width: 20rem;
            margin: 0 auto;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.94);
            font-size: 0.75rem;
            font-style: italic;
            line-height: 1.2;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 50, 75, 0.25);
        }

        .footer-break {
            display: none;
        }

        /* Animações */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsividade */
        @media (min-width: 375px) {
            .main-container {
                max-width: 24rem;
                margin-top: 1rem;
                padding: 1.5rem 1.25rem 1.25rem;
            }

            .profile-image {
                width: 8rem;
                height: 8rem;
                border-width: 4px;
            }

            .verification-badge {
                top: 0.25rem;
                right: 0.25rem;
                width: 1.5rem;
                height: 1.5rem;
            }

            .verification-badge i {
                font-size: 0.75rem;
            }

            .profile-name {
                font-size: 1.875rem;
            }

            .social-btn {
                gap: 0.75rem;
                padding: 0.8rem 1rem;
                border-radius: 1.25rem;
                font-size: 0.9rem;
            }

            .social-btn i {
                font-size: 1.125rem;
            }

            .gift-emoji {
                font-size: 1rem;
            }

            .footer-break {
                display: block;
            }

            .footer-text {
                line-height: 1.5;
            }
        }

        @media (min-width: 640px) {
            body {
                padding: 1.5rem 1.5rem 8rem;
            }

            .main-container {
                max-width: 28rem;
                margin-top: 1.5rem;
                padding: 1.75rem 1.5rem 1.5rem;
            }

            .profile-image {
                width: 9rem;
                height: 9rem;
            }

            .verification-badge {
                width: 1.75rem;
                height: 1.75rem;
            }

            .verification-badge i {
                font-size: 0.875rem;
            }

            .profile-name {
                font-size: 2.25rem;
            }

            .social-btn {
                gap: 1rem;
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }

            .social-btn i {
                font-size: 1.25rem;
            }

            .gift-emoji {
                font-size: 1.125rem;
            }

            .footer {
                padding: 0.75rem 1rem;
            }

            .footer-content {
                max-width: 24rem;
            }

            .footer-text {
                font-size: 0.875rem;
            }
        }

        @media (min-width: 768px) {
            .profile-image {
                width: 10rem;
                height: 10rem;
            }

            .profile-name {
                font-size: 3rem;
            }

            .social-btn {
                font-size: 1.125rem;
            }
        }

        @media (min-width: 1024px) {
            .profile-image {
                width: 11rem;
                height: 11rem;
            }

            .profile-name {
                font-size: 3.75rem;
            }

            .social-btn {
                font-size: 1.25rem;
            }
        }

        /* Prevenir zoom em inputs no iOS */
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            input,
            select,
            textarea {
                font-size: 16px;
            }
        }

        /* Reduzir animações para usuários que preferem */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s) {
            if (f.fbq) return;

            n = f.fbq = function() {
                n.callMethod
                    ? n.callMethod.apply(n, arguments)
                    : n.queue.push(arguments);
            };

            if (!f._fbq) f._fbq = n;

            n.push = n;
            n.loaded = true;
            n.version = "2.0";
            n.queue = [];

            t = b.createElement(e);
            t.async = true;
            t.src = v;

            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
        }(
            window,
            document,
            "script",
            "https://connect.facebook.net/en_US/fbevents.js"
        );

        fbq("init", "1066768842543167");

        // Gera eventID para o PageView
        const pageViewEventId = "pv_" + Date.now();

        // Envia o PageView com o eventID
        fbq("track", "PageView", {}, {
            eventID: pageViewEventId
        });

        // Salva o eventID em cookie para o CAPI usar também
        document.cookie =
            "fb_pageview_id=" +
            pageViewEventId +
            "; path=/; max-age=86400; SameSite=Lax";
    </script>

    <noscript>
        <img
            height="1"
            width="1"
            style="display:none"
            src="https://www.facebook.com/tr?id=1066768842543167&ev=PageView&noscript=1"
            alt=""
        >
    </noscript>
    <!-- End Meta Pixel Code -->

</body>
</html>
